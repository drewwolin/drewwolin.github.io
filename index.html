<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drew's Current Sprints</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function App() {
            const [projects, setProjects] = useState([
                { id: 1, title: "Portfolio Redesign", description: "Updating my site with React.", start: "2024-03-01", end: "2024-05-15", link: "https://true-well-then.github.io" }
            ]);
            const [learnings, setLearnings] = useState([
                { id: 1, title: "TypeScript Mastery", description: "Learning advanced types.", start: "2024-03-10", end: "2024-04-20", link: "https://linkedin.com" }
            ]);
            const [showForm, setShowForm] = useState(null);
            const [formData, setFormData] = useState({ title: '', description: '', start: '', end: '', link: '' });

            const calculateProgress = (start, end) => {
                const s = new Date(start);
                const e = new Date(end);
                const now = new Date();
                if (now < s) return 0;
                if (now > e) return 100;
                return Math.round(((now - s) / (e - s)) * 100);
            };

            const handleAdd = (e) => {
                e.preventDefault();
                const item = { ...formData, id: Date.now() };
                if (showForm === 'project') setProjects([...projects, item]);
                else setLearnings([...learnings, item]);
                setShowForm(null);
                setFormData({ title: '', description: '', start: '', end: '', link: '' });
            };

            return (
                <div className="min-h-screen p-8">
                    <header className="max-w-6xl mx-auto flex justify-between items-center mb-12">
                        <div>
                            <h1 className="text-4xl font-extrabold text-indigo-600">Current Sprints</h1>
                            <p className="text-slate-500">Studying, skill building, and projects.</p>
                        </div>
                        <div className="space-x-4">
                            <a href="https://true-well-then.github.io" className="text-sm font-bold px-4 py-2 bg-slate-800 text-white rounded-lg">Github</a>
                            <a href="https://linkedin.com" className="text-sm font-bold px-4 py-2 bg-blue-600 text-white rounded-lg">LinkedIn</a>
                        </div>
                    </header>

                    <div className="max-w-6xl mx-auto grid md:grid-cols-2 gap-10">
                        {/* Projects */}
                        <section>
                            <div className="flex justify-between mb-4">
                                <h2 className="text-2xl font-bold">Projects ({projects.length}/3)</h2>
                                {projects.length < 3 && <button onClick={() => setShowForm('project')} className="bg-indigo-100 text-indigo-600 px-3 rounded">+</button>}
                            </div>
                            {projects.map(p => (
                                <div key={p.id} className="bg-white p-6 rounded-xl shadow-sm mb-4 border border-slate-100">
                                    <h3 className="font-bold text-lg">{p.title}</h3>
                                    <p className="text-slate-500 text-sm mb-4">{p.description}</p>
                                    <div className="w-full bg-slate-100 h-2 rounded-full mb-2">
                                        <div className="bg-indigo-500 h-2 rounded-full" style={{width: calculateProgress(p.start, p.end) + '%'}}></div>
                                    </div>
                                    <div className="flex justify-between text-xs font-bold">
                                        <span>{calculateProgress(p.start, p.end)}%</span>
                                        <a href={p.link} className="text-indigo-600">Link →</a>
                                    </div>
                                </div>
                            ))}
                        </section>

                        {/* Learnings */}
                        <section>
                            <div className="flex justify-between mb-4">
                                <h2 className="text-2xl font-bold">Learning ({learnings.length}/3)</h2>
                                {learnings.length < 3 && <button onClick={() => setShowForm('learning')} className="bg-emerald-100 text-emerald-600 px-3 rounded">+</button>}
                            </div>
                            {learnings.map(l => (
                                <div key={l.id} className="bg-white p-6 rounded-xl shadow-sm mb-4 border border-slate-100">
                                    <h3 className="font-bold text-lg">{l.title}</h3>
                                    <p className="text-slate-500 text-sm mb-4">{l.description}</p>
                                    <div className="w-full bg-slate-100 h-2 rounded-full mb-2">
                                        <div className="bg-emerald-500 h-2 rounded-full" style={{width: calculateProgress(l.start, l.end) + '%'}}></div>
                                    </div>
                                    <div className="flex justify-between text-xs font-bold">
                                        <span>{calculateProgress(l.start, l.end)}%</span>
                                        <a href={l.link} className="text-emerald-600">LinkedIn →</a>
                                    </div>
                                </div>
                            ))}
                        </section>
                    </div>

                    {showForm && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4">
                            <form onSubmit={handleAdd} className="bg-white p-8 rounded-2xl w-full max-w-md shadow-xl">
                                <h2 className="text-xl font-bold mb-4">Add New</h2>
                                <input required placeholder="Title" className="w-full border p-2 mb-2 rounded" onChange={e => setFormData({...formData, title: e.target.value})} />
                                <textarea placeholder="Description" className="w-full border p-2 mb-2 rounded" onChange={e => setFormData({...formData, description: e.target.value})} />
                                <div className="flex gap-2 mb-2">
                                    <input type="date" required className="w-1/2 border p-2 rounded" onChange={e => setFormData({...formData, start: e.target.value})} />
                                    <input type="date" required className="w-1/2 border p-2 rounded" onChange={e => setFormData({...formData, end: e.target.value})} />
                                </div>
                                <input placeholder="Link" className="w-full border p-2 mb-4 rounded" onChange={e => setFormData({...formData, link: e.target.value})} />
                                <div className="flex gap-2">
                                    <button type="button" onClick={() => setShowForm(null)} className="w-1/2 p-2 bg-slate-100 rounded">Cancel</button>
                                    <button type="submit" className="w-1/2 p-2 bg-indigo-600 text-white rounded">Add</button>
                                </div>
                            </form>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
