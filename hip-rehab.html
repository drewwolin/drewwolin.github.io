<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hip Rehab Tracker | Progress Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Recharts Dependencies -->
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .recharts-responsive-container { min-height: 300px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>
    <script type="text/babel">
        // Safe access to Recharts
        const { 
            LineChart, Line, BarChart, Bar, XAxis, YAxis, 
            CartesianGrid, Tooltip, Legend, ResponsiveContainer 
        } = window.Recharts || {};

        function App() {
            if (!window.Recharts) {
                return (
                    <div className="flex items-center justify-center min-h-screen">
                        <div className="text-center p-8 bg-white rounded-2xl shadow-xl">
                            <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mx-auto mb-4"></div>
                            <p className="text-slate-600 font-medium">Loading visualization libraries...</p>
                        </div>
                    </div>
                );
            }

            // Sample data for the last 7 sessions
            const data = [
                { date: 'Apr 03', pain: 8, mobility: 2, reps: 20 },
                { date: 'Apr 06', pain: 7, mobility: 3, reps: 25 },
                { date: 'Apr 09', pain: 6, mobility: 4, reps: 30 },
                { date: 'Apr 12', pain: 5, mobility: 5, reps: 45 },
                { date: 'Apr 15', pain: 4, mobility: 6, reps: 60 },
                { date: 'Apr 18', pain: 4, mobility: 7, reps: 75 },
                { date: 'Apr 21', pain: 3, mobility: 8, reps: 90 },
            ];

            return (
                <div className="min-h-screen p-6 md:p-12 max-w-7xl mx-auto">
                    <header className="flex justify-between items-center mb-12">
                        <div>
                            <h1 className="text-4xl font-extrabold tracking-tight text-slate-900 mb-2">Hip Rehab Progress</h1>
                            <p className="text-slate-500 font-medium italic">Transforming recovery into data-driven results.</p>
                        </div>
                        <a href="index.html" className="text-sm font-bold px-6 py-3 bg-white border border-slate-200 text-slate-600 rounded-full hover:bg-slate-50 transition-all shadow-sm flex items-center gap-2">
                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                            Back to Sprints
                        </a>
                    </header>

                    <div className="grid lg:grid-cols-2 gap-8">
                        {/* Pain & Mobility Line Chart */}
                        <div className="bg-white p-8 rounded-3xl shadow-sm border border-slate-200">
                            <div className="mb-6">
                                <h2 className="text-xl font-bold mb-1">Pain vs. Mobility Scores</h2>
                                <p className="text-slate-400 text-sm italic">Lower pain + Higher mobility = Success.</p>
                            </div>
                            <div className="h-[350px]">
                                <ResponsiveContainer width="100%" height="100%">
                                    <LineChart data={data}>
                                        <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                        <XAxis dataKey="date" axisLine={false} tickLine={false} tick={{fill: '#94a3b8', fontSize: 12}} dy={10} />
                                        <YAxis axisLine={false} tickLine={false} tick={{fill: '#94a3b8', fontSize: 12}} dx={-10} domain={[0, 10]} />
                                        <Tooltip 
                                            contentStyle={{borderRadius: '16px', border: 'none', boxShadow: '0 10px 15px -3px rgba(0,0,0,0.1)'}}
                                        />
                                        <Legend verticalAlign="top" height={36} align="right" iconType="circle" />
                                        <Line type="monotone" dataKey="pain" stroke="#ef4444" strokeWidth={4} dot={{r: 6, fill: '#ef4444', strokeWidth: 2, stroke: '#fff'}} activeDot={{r: 8}} name="Pain Level" />
                                        <Line type="monotone" dataKey="mobility" stroke="#10b981" strokeWidth={4} dot={{r: 6, fill: '#10b981', strokeWidth: 2, stroke: '#fff'}} activeDot={{r: 8}} name="Mobility Level" />
                                    </LineChart>
                                </ResponsiveContainer>
                            </div>
                        </div>

                        {/* Exercise Volume Bar Chart */}
                        <div className="bg-white p-8 rounded-3xl shadow-sm border border-slate-200">
                            <div className="mb-6">
                                <h2 className="text-xl font-bold mb-1">Total Exercise Volume</h2>
                                <p className="text-slate-400 text-sm italic">Combined reps for Bridges, Clamshells & Squats.</p>
                            </div>
                            <div className="h-[350px]">
                                <ResponsiveContainer width="100%" height="100%">
                                    <BarChart data={data}>
                                        <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                        <XAxis dataKey="date" axisLine={false} tickLine={false} tick={{fill: '#94a3b8', fontSize: 12}} dy={10} />
                                        <YAxis axisLine={false} tickLine={false} tick={{fill: '#94a3b8', fontSize: 12}} dx={-10} />
                                        <Tooltip 
                                            cursor={{fill: '#f8fafc'}}
                                            contentStyle={{borderRadius: '16px', border: 'none', boxShadow: '0 10px 15px -3px rgba(0,0,0,0.1)'}}
                                        />
                                        <Bar dataKey="reps" fill="#6366f1" radius={[10, 10, 0, 0]} name="Total Reps" />
                                    </BarChart>
                                </ResponsiveContainer>
                            </div>
                        </div>

                        {/* Stats Summary Cards */}
                        <div className="lg:col-span-2 grid md:grid-cols-3 gap-6">
                            <div className="bg-emerald-50 border border-emerald-100 p-6 rounded-2xl">
                                <h3 className="text-emerald-800 text-sm font-bold uppercase tracking-wider mb-2">Mobility Trend</h3>
                                <div className="text-3xl font-black text-emerald-900">+400%</div>
                                <p className="text-emerald-600 text-xs mt-1">Increase from session 1</p>
                            </div>
                            <div className="bg-rose-50 border border-rose-100 p-6 rounded-2xl">
                                <h3 className="text-rose-800 text-sm font-bold uppercase tracking-wider mb-2">Pain Reduction</h3>
                                <div className="text-3xl font-black text-rose-900">-62%</div>
                                <p className="text-rose-600 text-xs mt-1">Reported discomfort down</p>
                            </div>
                            <div className="bg-indigo-50 border border-indigo-100 p-6 rounded-2xl">
                                <h3 className="text-indigo-800 text-sm font-bold uppercase tracking-wider mb-2">Current Sprint</h3>
                                <div className="text-3xl font-black text-indigo-900">Phase 2</div>
                                <p className="text-indigo-600 text-xs mt-1">Weighted loading exercises</p>
                            </div>
                        </div>
                    </div>

                    <footer className="mt-16 pt-8 border-t border-slate-200 text-center text-slate-400 text-xs font-medium uppercase tracking-widest">
                        Rehab Data Updated via Sprint Hub
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
